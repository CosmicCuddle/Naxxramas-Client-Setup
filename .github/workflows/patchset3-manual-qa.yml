name: Synthetic patchset 0003 manual QA matrix

on:
  pull_request:
    paths:
      - 'tools/plan_patchset3_manual_qa.py'
      - 'tests/test_patchset3_manual_qa_plan.py'
      - 'tools/review_patch_update_proposal.py'
      - 'tests/fixtures/synthetic-patch-proposal-v3.json'
      - 'tests/fixtures/public-release-metadata-v1.json'
      - 'docs/PATCHSET3-MANUAL-QA-PLAN.md'
      - '.github/workflows/patchset3-manual-qa.yml'
  push:
    paths:
      - 'tools/plan_patchset3_manual_qa.py'
      - 'tests/test_patchset3_manual_qa_plan.py'
      - '.github/workflows/patchset3-manual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan-only:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out developer-only planning files
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test all 31 patch subsets against six valid plus two forbidden options
        run: python -m unittest discover -s tests -p test_patchset3_manual_qa_plan.py -v
      - name: Produce example unperformed QA plan from fake V-only proposal
        run: python tools/plan_patchset3_manual_qa.py --proposal tests/fixtures/synthetic-patch-proposal-v3.json --release-snapshot tests/fixtures/public-release-metadata-v1.json
      - name: Retain all previous frozen history and proposal refusal regressions
        run: python -m unittest discover -s tests -p test_patch_update_proposal_evidence.py -v
