name: Read-only trust continuity fixtures

on:
  pull_request:
    paths:
      - 'tools/Review-Naxxramas-TrustContinuity.ps1'
      - 'tests/Test-TrustContinuity.ps1'
      - 'docs/TRUST-CONTINUITY-REVIEW.md'
      - '.github/workflows/trust-continuity-fixtures.yml'
  push:
    paths:
      - 'tools/Review-Naxxramas-TrustContinuity.ps1'
      - 'tests/Test-TrustContinuity.ps1'
      - 'docs/TRUST-CONTINUITY-REVIEW.md'
      - '.github/workflows/trust-continuity-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run synthetic trust loss and migration matrix
        shell: powershell
        run: .\tests\Test-TrustContinuity.ps1
