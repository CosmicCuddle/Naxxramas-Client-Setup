name: Read-only approval snapshot fixtures

on:
  pull_request:
    paths:
      - 'tools/Review-Naxxramas-ApprovalFixture.ps1'
      - 'tests/Test-ApprovalFixture.ps1'
      - 'tests/Test-ApprovalDigestV2.ps1'
      - 'docs/APPROVAL-SNAPSHOT-REVIEW.md'
      - '.github/workflows/approval-snapshot-fixtures.yml'
  push:
    paths:
      - 'tools/Review-Naxxramas-ApprovalFixture.ps1'
      - 'tests/Test-ApprovalFixture.ps1'
      - 'tests/Test-ApprovalDigestV2.ps1'
      - 'docs/APPROVAL-SNAPSHOT-REVIEW.md'
      - '.github/workflows/approval-snapshot-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check untrusted approval snapshot comparisons
        shell: powershell
        run: |
          .\tests\Test-ApprovalFixture.ps1
          .\tests\Test-ApprovalDigestV2.ps1
