name: Validate Naxxramas setup tools

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Parse all PowerShell tests before execution
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -LiteralPath 'tests' -File -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $issues = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$issues) | Out-Null
            if (@($issues).Count -ne 0) {
              throw ('PowerShell test syntax error in ' + $_.Name + ': ' + ($issues -join '; '))
            }
          }
      - name: Preflight and patch version smoke tests
        shell: powershell
        run: .\tests\Test-Preflight.ps1
      - name: Reference client sanitised inspection fixture tests
        shell: powershell
        run: .\tests\Test-Reference-Client.ps1
      - name: Reference component separation tests (reports only)
        shell: powershell
        run: .\tests\Test-Component-Plan.ps1
      - name: Whitelisted game file inventory fixture tests
        shell: powershell
        run: .\tests\Test-Game-File-Inventory.ps1
      - name: Private game-file report review fixture tests
        shell: powershell
        run: .\tests\Test-Game-File-Report-Review.ps1
      - name: Local-only unknown MPQ classification fixture tests
        shell: powershell
        run: .\tests\Test-Unclassified-MPQs.ps1
      - name: Non-MPQ support file metadata-only fixture tests
        shell: powershell
        run: .\tests\Test-Client-Support-Files.ps1
      - name: Disposable client copy, verified rollback, and marker security tests
        shell: powershell
        run: .\tests\Test-Client-Copy-Fixture.ps1
      - name: Installer alpha fixture tests (dummy files only)
        shell: powershell
        run: .\tests\Test-Installer-Prototype.ps1
      - name: Verify addon release ZIP fingerprint tooling
        shell: powershell
        run: .\tests\Test-Addon-Release.ps1
      - name: Verified addon ZIP extraction fixture tests
        shell: powershell
        run: .\tests\Test-Verified-Extraction.ps1
      - name: Offline verified patch downloader fixture tests
        shell: powershell
        run: .\tests\Test-Patch-Downloads.ps1
      - name: Fresh client read-only planning and source-lock fixture tests
        shell: powershell
        run: .\tests\Test-Fresh-Client-Plan.ps1
      - name: Headless Windows GUI preview safety tests
        shell: powershell
        run: .\tests\Test-GUI-Preview.ps1
      - name: Package read-only classic launcher preview
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'Naxxramas-Client-Preview'
          New-Item -Path $stage -ItemType Directory -Force | Out-Null
          $files = @(
            'tools/Launch-Naxxramas-Preview.bat'
            'tools/Naxxramas-Preview.ps1'
            'tools/GUI-Preview-Lib.ps1'
            'tools/Setup-Prototype.ps1'
            'tools/Get-Patch-Sources.ps1'
            'tools/Plan-Fresh-Client.ps1'
            'tools/Inspect-Reference-Client.ps1'
            'tools/Inspect-Reference-Client.bat'
            'tools/Plan-Reference-Components.ps1'
            'tools/Plan-Reference-Components.bat'
            'tools/Inventory-Game-Files.ps1'
            'tools/Inventory-Game-Files.bat'
            'tools/Review-Game-File-Report.ps1'
            'tools/Review-Game-File-Report.bat'
            'tools/Inspect-Unclassified-MPQs.ps1'
            'tools/Inspect-Unclassified-MPQs.bat'
            'tools/Inspect-Client-Support-Files.ps1'
            'tools/Inspect-Client-Support-Files.bat'
            'tools/Test-Client-Copy-Fixture.ps1'
            'tools/Verified-Addon-Zip.ps1'
            'config/client-patches.json'
            'config/patch-downloads.json'
            'config/base-client-source.json'
            'config/addon-suite.json'
            'config/realm.json'
            'docs/INSTALLER-MILESTONE-8.md'
            'docs/INSTALLER-MILESTONE-10.md'
            'docs/INSTALLER-MILESTONE-11.md'
            'docs/INSTALLER-MILESTONE-12.md'
            'docs/INSTALLER-MILESTONE-13.md'
            'docs/INSTALLER-MILESTONE-14.md'
            'docs/INSTALLER-MILESTONE-15.md'
            'docs/INSTALLER-MILESTONE-16.md'
            'docs/INSTALLER-MILESTONE-17.md'
            'docs/INSTALLER-MILESTONE-18.md'
            'docs/INSTALLER-MILESTONE-19.md'
            'docs/PROJECT-HANDOVER.md'
            'assets/README.md'
          )
          foreach ($relative in $files) {
            if (-not (Test-Path -LiteralPath $relative -PathType Leaf)) {
              throw "Missing expected preview component: $relative"
            }
            $target = Join-Path $stage $relative
            New-Item -Path (Split-Path -Parent $target) -ItemType Directory -Force | Out-Null
            Copy-Item -LiteralPath $relative -Destination $target
          }
          # Only ship default art when intentionally placed in assets/default.
          # Never ship private per-user overrides stored in assets/local.
          foreach ($relative in @('assets/default/launcher-art.png', 'assets/default/launcher-logo.png')) {
            if (Test-Path -LiteralPath $relative -PathType Leaf) {
              $target = Join-Path $stage $relative
              New-Item -Path (Split-Path -Parent $target) -ItemType Directory -Force | Out-Null
              Copy-Item -LiteralPath $relative -Destination $target
            }
          }
          @'
          NAXXRAMAS CLIENT LAUNCHER - DEVELOPMENT PREVIEW
          ------------------------------------------------
          Open tools\Launch-Naxxramas-Preview.bat on Windows.
          Project handover: docs\PROJECT-HANDOVER.md (read when resuming).
          This preview checks existing clients and plans fresh installations, but CANNOT install a full game client.
          No WoW client or proprietary MPQ archives are included.
          Optional default artwork (if present) is shipped from assets\default.
          Ensure artwork rights are reviewed before distributing to others.
          Artwork is publisher-managed at assets\default\launcher-art.png.
          Only the package owner updates it by replacing the file then rebuilding.
          No artwork changing controls are available to players.
          Do not use this as a public installer.
          '@ | Set-Content -LiteralPath (Join-Path $stage 'READ-ME-FIRST.txt') -Encoding UTF8
          $output = Join-Path $env:GITHUB_WORKSPACE 'Naxxramas-Client-Preview.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $output -CompressionLevel Optimal -Force
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw 'Preview ZIP was not created.' }
          Write-Host ("Built preview artifact: {0} bytes" -f (Get-Item -LiteralPath $output).Length)
      - name: Upload read-only launcher preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: naxxramas-launcher-preview
          path: Naxxramas-Client-Preview.zip
          if-no-files-found: error
          retention-days: 14
