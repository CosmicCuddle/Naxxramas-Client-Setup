name: Synthetic signed journal fixture tests

on:
  push:
    paths:
      - 'tools/Inspect-Naxxramas-JournalV2.ps1'
      - 'tests/Test-JournalV2.ps1'
      - '.github/workflows/journal-v2-fixtures.yml'
  pull_request:
    paths:
      - 'tools/Inspect-Naxxramas-JournalV2.ps1'
      - 'tests/Test-JournalV2.ps1'
      - '.github/workflows/journal-v2-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run synthetic signed fixture tests
        shell: powershell
        run: .\tests\Test-JournalV2.ps1
