name: Read-only existing backup copy tests

on:
  pull_request:
    paths:
      - 'tools/Review-Naxxramas-ExistingBackupCopies.ps1'
      - 'tests/Test-ExistingBackupCopies.ps1'
      - 'docs/EXISTING-BACKUP-COPIES.md'
      - '.github/workflows/existing-backup-copy-tests.yml'
  push:
    paths:
      - 'tools/Review-Naxxramas-ExistingBackupCopies.ps1'
      - 'tests/Test-ExistingBackupCopies.ps1'
      - 'docs/EXISTING-BACKUP-COPIES.md'
      - '.github/workflows/existing-backup-copy-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compare actual fake originals to pre-existing mirrored backup copies
        shell: powershell
        run: .\tests\Test-ExistingBackupCopies.ps1
