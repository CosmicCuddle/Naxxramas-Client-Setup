name: Read-only registration fixture tests

on:
  push:
    paths:
      - 'tools/Review-Naxxramas-RegistrationFixture.ps1'
      - 'tests/Test-RegistrationFixture.ps1'
      - 'docs/REGISTRATION-FIXTURE-REVIEW.md'
      - 'docs/ROADMAP.md'
      - 'docs/PROJECT-HANDOVER.md'
      - '.github/workflows/registration-fixture-tests.yml'
  pull_request:
    paths:
      - 'tools/Review-Naxxramas-RegistrationFixture.ps1'
      - 'tests/Test-RegistrationFixture.ps1'
      - 'docs/REGISTRATION-FIXTURE-REVIEW.md'
      - 'docs/ROADMAP.md'
      - 'docs/PROJECT-HANDOVER.md'
      - '.github/workflows/registration-fixture-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run registration and interruption fixtures
        shell: powershell
        run: .\tests\Test-RegistrationFixture.ps1
