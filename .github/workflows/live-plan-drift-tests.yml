name: Read-only live plan drift tests

on:
  pull_request:
    paths:
      - 'tools/Review-Naxxramas-LivePlan.ps1'
      - 'tests/Test-LivePlanDrift.ps1'
      - 'docs/LIVE-PLAN-RECHECK.md'
      - '.github/workflows/live-plan-drift-tests.yml'
  push:
    paths:
      - 'tools/Review-Naxxramas-LivePlan.ps1'
      - 'tests/Test-LivePlanDrift.ps1'
      - 'docs/LIVE-PLAN-RECHECK.md'
      - '.github/workflows/live-plan-drift-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check real planner and directory identity on disposable fixtures
        shell: powershell
        run: .\tests\Test-LivePlanDrift.ps1
