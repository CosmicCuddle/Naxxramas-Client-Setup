name: Synthetic-only addon authority and crash boundaries

on:
  pull_request:
    paths:
      - 'tools/review_synthetic_addon_authority.py'
      - 'tests/test_synthetic_addon_authority.py'
      - 'tools/review_synthetic_addon_journal.py'
      - 'tools/review_synthetic_addon_recovery.py'
      - '.github/workflows/synthetic-addon-authority-boundaries.yml'
      - 'docs/ADDON-EVIDENCE-AND-RECOVERY.md'
  push:
    paths:
      - 'tools/review_synthetic_addon_authority.py'
      - 'tests/test_synthetic_addon_authority.py'
      - '.github/workflows/synthetic-addon-authority-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-recovery-only:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout developer-only source
        uses: actions/checkout@v4
      - name: Prepare Python 3.12 for isolated synthetic tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test unauthenticated authority and every synthetic crash window
        run: python -m unittest discover -s tests -p test_synthetic_addon_authority.py -v
      - name: Regression-test existing synthetic journal refusals
        run: python -m unittest discover -s tests -p test_synthetic_addon_journal.py -v
      - name: Regression-test complete fake-addon original and WTF integrity
        run: python -m unittest discover -s tests -p test_synthetic_addon_recovery.py -v
